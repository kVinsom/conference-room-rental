name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        run: dotnet restore ConferenceRoomRental.sln

      - name: Build
        run: dotnet build ConferenceRoomRental.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ConferenceRoomRental.sln --configuration Release --no-build --no-restore --collect:"XPlat Code Coverage"

      - name: Validate Docker Compose
        run: docker compose config --quiet
