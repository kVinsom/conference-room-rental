name: conference-room-rental

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: conference_room_rental
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d conference_room_rental"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=conference_room_rental;Username=postgres;Password=postgres;GSS Encryption Mode=Disable
      Business__TimeZone: Europe/Kyiv
      Database__ApplyMigrations: "true"
      Database__Seed: "true"
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
